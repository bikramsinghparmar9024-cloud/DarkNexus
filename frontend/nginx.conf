server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The interface is a single-page application: every path that is not a
    # real file has to return index.html, or a refresh on /sources answers 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API is proxied rather than called cross-origin, so the browser sees
    # one origin and no CORS preflight is needed.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Collection runs inside the request for a manual trigger, and a
        # hidden service can take most of a minute to answer.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        # Seized images are submitted through here.
        client_max_body_size 32m;
    }

    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # Hashed bundle filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
